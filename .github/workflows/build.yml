name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # ДОБАВЛЯЕМ ВЫДАЧУ ПРАВ ПЕРЕД СБОРКОЙ:
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RSR_v3.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSR
          path: app/build/outputs/apk/debug/RSR_v3.0.2.apk
